name: Gateway CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Test
        run: python -m pytest -q
      - name: Shell syntax
        run: bash -n openclaw/install.sh openclaw/verify.sh openclaw/xfi-vpn-heal.sh deploy/install.sh deploy/preflight.sh deploy/smoke_test.sh
