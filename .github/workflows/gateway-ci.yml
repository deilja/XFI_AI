name: Gateway CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Test
        run: python -m pytest -q
      - name: Ruff
        run: python -m pip install 'ruff>=0.6,<1' && ruff check app tests
      - name: Bandit
        run: python -m pip install 'bandit>=1.7,<2' && bandit -q -r app
      - name: Dependency audit
        run: python -m pip install 'pip-audit>=2.7,<3' && pip-audit
      - name: Shell syntax
        run: bash -n openclaw/install.sh openclaw/verify.sh openclaw/xfi-vpn-heal.sh deploy/install.sh deploy/preflight.sh deploy/smoke_test.sh
