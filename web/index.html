<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XFI AI Admin</title><style>body{margin:0;background:#0b1020;color:#e8ecf7;font:15px system-ui;display:grid;place-items:center;min-height:100vh}.card{width:min(760px,94vw);background:#121a2d;border:1px solid #263452;border-radius:18px;padding:25px;box-sizing:border-box}input,button{padding:11px;border-radius:9px;border:1px solid #34415f;background:#0b1222;color:#fff}input{width:100%;box-sizing:border-box;margin:6px 0 10px}button{cursor:pointer;margin-right:7px}table{width:100%;margin-top:18px;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #263452}.ok{font-weight:600}.muted{color:#aeb8ce}.key{margin-top:12px;padding:12px;background:#09101d;word-break:break-all;display:none}</style></head><body><main class="card"><h1>XFI AI Admin</h1><p class="muted">Управление клиентскими API keys и мониторинг AI-провайдеров.</p><input id="admin" type="password" placeholder="Административный ключ" autocomplete="off"><input id="name" placeholder="Имя нового клиента"><button onclick="issue()">Создать API key</button><button onclick="load()">Обновить статус AI</button><div id="key" class="key"></div><table><thead><tr><th>Провайдер</th><th>Запросы</th><th>Ошибки</th><th>Latency</th><th>Последний HTTP</th></tr></thead><tbody id="rows"></tbody></table><script>const H=()=>({'X-Admin-Key':document.getElementById('admin').value});async function issue(){let r=await fetch('/api/keys',{method:'POST',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value||'client'})}),d=await r.json(),o=document.getElementById('key');o.textContent=r.ok?d.api_key:(d.detail||'Ошибка');o.style.display='block'}async function load(){let r=await fetch('/admin/providers',{headers:H()}),d=await r.json();if(!r.ok){alert(d.detail||'Ошибка');return}document.getElementById('rows').innerHTML=d.providers.map(x=>`<tr><td>${x.provider}</td><td>${x.requests}</td><td>${x.failures}</td><td>${Math.round(x.latency_ms)} ms</td><td>${x.last_status||'-'}</td></tr>`).join('')}load();</script></main></body></html>
