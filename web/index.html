<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XFI AI Admin</title>
<style>body{margin:0;background:#0b1020;color:#e8ecf7;font:15px system-ui;display:grid;place-items:center;min-height:100vh}.card{width:min(1180px,95vw);background:#121a2d;border:1px solid #263452;border-radius:18px;padding:25px;box-sizing:border-box}input,button{padding:10px;border-radius:9px;border:1px solid #34415f;background:#0b1222;color:#fff}input{box-sizing:border-box;margin:4px}button{cursor:pointer;margin:4px}table{width:100%;margin-top:12px;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #263452}.muted{color:#aeb8ce}.key{margin-top:12px;padding:12px;background:#09101d;word-break:break-all;display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.danger{border-color:#7d3340}.ok{color:#7ee787}.bad{color:#ff7b72}.section{margin-top:28px}</style></head>
<body><main class="card"><h1>XFI AI Admin</h1><p class="muted">AI providers, API keys, VPS services и безопасный контроль OpenClaw.</p>
<input id="admin" type="password" placeholder="Административный ключ" autocomplete="off"><button onclick="loadAll()">Обновить всё</button>
<div class="section"><h3>Новый API key</h3><div class="grid"><input id="name" placeholder="Имя клиента"><input id="rpm" type="number" value="60" placeholder="RPM"><input id="daily" type="number" value="5000" placeholder="Лимит/день"></div><button onclick="issue()">Создать API key</button><div id="key" class="key"></div></div>
<div class="section"><h3>Клиентские ключи</h3><table><thead><tr><th>ID</th><th>Имя</th><th>Активен</th><th>RPM</th><th>День</th><th>Использовано</th><th>Действия</th></tr></thead><tbody id="keys"></tbody></table></div>
<div class="section"><h3>AI-провайдеры</h3><table><thead><tr><th>Провайдер</th><th>Запросы</th><th>Ошибки</th><th>Latency</th><th>HTTP</th></tr></thead><tbody id="providers"></tbody></table></div>
<div class="section"><h3>VPS / сервисы</h3><table><thead><tr><th>Сервис</th><th>Состояние</th><th>Действие</th></tr></thead><tbody id="services"></tbody></table><h4>Docker</h4><pre id="docker" class="muted"></pre></div>
<script>const H=()=>({'X-Admin-Key':document.getElementById('admin').value});
async function issue(){let r=await fetch('/api/keys',{method:'POST',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value||'client',rpm:+document.getElementById('rpm').value||60,daily:+document.getElementById('daily').value||5000})}),d=await r.json(),o=document.getElementById('key');o.textContent=r.ok?d.api_key:(d.detail||'Ошибка');o.style.display='block';loadKeys()}
async function loadKeys(){let r=await fetch('/admin/keys',{headers:H()}),d=await r.json();if(!r.ok)return;document.getElementById('keys').innerHTML=d.keys.map(x=>`<tr><td>${x.id}</td><td>${esc(x.name)}</td><td>${x.active?'Да':'Нет'}</td><td>${x.rpm_limit}</td><td>${x.daily_limit}</td><td>${x.requests_today}</td><td><button onclick="toggle(${x.id},${!x.active})">${x.active?'Отключить':'Включить'}</button><button class="danger" onclick="removeKey(${x.id})">Удалить</button></td></tr>`).join('')}
async function toggle(id,active){await fetch('/admin/keys/'+id+'/active',{method:'POST',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify({active})});loadKeys()}async function removeKey(id){if(confirm('Удалить ключ?')){await fetch('/admin/keys/'+id,{method:'DELETE',headers:H()});loadKeys()}}
async function loadProviders(){let r=await fetch('/admin/providers',{headers:H()}),d=await r.json();if(!r.ok)return;document.getElementById('providers').innerHTML=d.providers.map(x=>`<tr><td>${esc(x.provider)}</td><td>${x.requests}</td><td>${x.failures}</td><td>${Math.round(x.latency_ms)} ms</td><td>${x.last_status||'-'}</td></tr>`).join('')}
async function loadSystem(){let r=await fetch('/admin/system',{headers:H()}),d=await r.json();if(!r.ok)return;document.getElementById('services').innerHTML=d.services.map(x=>`<tr><td>${x.name}</td><td class="${x.active?'ok':'bad'}">${x.status}</td><td><button onclick="restartSvc('${x.name}')">Безопасный restart</button></td></tr>`).join('');document.getElementById('docker').textContent=d.docker.join('\n')||'Нет контейнеров'}
async function restartSvc(s){if(!confirm('Перезапустить '+s+'?'))return;let r=await fetch('/admin/system/'+encodeURIComponent(s)+'/restart',{method:'POST',headers:H()});let d=await r.json();alert(r.ok?(d.service+': '+d.status):(d.detail||'Ошибка'));loadSystem()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function loadAll(){loadKeys();loadProviders();loadSystem()}loadAll();setInterval(loadSystem,30000);</script></main></body></html>
