<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
 <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#082f49"/><stop offset="1" stop-color="#172554"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#38bdf8"/></marker>
</defs>
<rect width="1400" height="820" rx="28" fill="url(#bg)"/>
<text x="70" y="62" fill="#7dd3fc" font-family="Inter,Arial" font-size="18" font-weight="700" letter-spacing="4">XFI_AI ARCHITECTURE</text>
<text x="70" y="105" fill="white" font-family="Inter,Arial" font-size="36" font-weight="900">Единая точка управления AI и инфраструктурой</text>
<!-- inputs -->
<g font-family="Inter,Arial" text-anchor="middle">
 <rect x="70" y="165" width="250" height="135" rx="20" fill="url(#card)" stroke="#38bdf8" stroke-width="2"/>
 <text x="195" y="205" fill="#7dd3fc" font-size="18" font-weight="800">CLIENTS</text><text x="195" y="240" fill="white" font-size="22" font-weight="700">Telegram</text><text x="195" y="268" fill="#cbd5e1" font-size="16">XFI_CONNECT • API / CLI</text>
 <rect x="375" y="165" width="650" height="135" rx="24" fill="#0b1f3a" stroke="#60a5fa" stroke-width="3"/>
 <text x="700" y="207" fill="#38bdf8" font-size="28" font-weight="900">XFI AI GATEWAY</text><text x="700" y="238" fill="white" font-size="17">FastAPI • authentication • rate limits • routing</text><text x="700" y="267" fill="#cbd5e1" font-size="17">failover • provider detection • metrics • audit</text>
 <rect x="1080" y="165" width="250" height="135" rx="20" fill="url(#card)" stroke="#818cf8" stroke-width="2"/>
 <text x="1205" y="205" fill="#c7d2fe" font-size="18" font-weight="800">ADMIN</text><text x="1205" y="240" fill="white" font-size="22" font-weight="700">Web Admin</text><text x="1205" y="268" fill="#cbd5e1" font-size="16">keys • VPS • audit</text>
</g>
<!-- control layer -->
<g font-family="Inter,Arial" text-anchor="middle">
 <rect x="70" y="370" width="390" height="145" rx="22" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="265" y="410" fill="#67e8f9" font-size="22" font-weight="800">Telegram Code Agent</text><text x="265" y="442" fill="#e2e8f0" font-size="16">/code → анализ → вопросы → план</text><text x="265" y="471" fill="#94a3b8" font-size="16">branch → commits → PR → CI</text><text x="265" y="498" fill="#94a3b8" font-size="14">без прямой записи в main</text>
 <rect x="505" y="370" width="390" height="145" rx="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><text x="700" y="410" fill="#7dd3fc" font-size="22" font-weight="800">Provider Router</text><text x="700" y="442" fill="#e2e8f0" font-size="16">Groq • Gemini • Mistral • OpenRouter</text><text x="700" y="471" fill="#94a3b8" font-size="16">Cloudflare • SambaNova • Cerebras</text><text x="700" y="498" fill="#94a3b8" font-size="14">Hugging Face • Cohere • расширяемо</text>
 <rect x="940" y="370" width="390" height="145" rx="22" fill="#0f172a" stroke="#818cf8" stroke-width="2"/><text x="1135" y="410" fill="#c7d2fe" font-size="22" font-weight="800">VPS Control Center</text><text x="1135" y="442" fill="#e2e8f0" font-size="16">SSH / API • diagnostics • logs</text><text x="1135" y="471" fill="#94a3b8" font-size="16">allowlist restart • Docker status</text><text x="1135" y="498" fill="#94a3b8" font-size="14">без произвольного shell</text>
</g>
<!-- providers -->
<g font-family="Inter,Arial" text-anchor="middle" font-weight="700">
 <rect x="70" y="590" width="200" height="75" rx="16" fill="#082f49" stroke="#38bdf8"/><text x="170" y="635" fill="#bae6fd" font-size="19">Groq</text>
 <rect x="290" y="590" width="200" height="75" rx="16" fill="#172554" stroke="#818cf8"/><text x="390" y="635" fill="#c7d2fe" font-size="19">Gemini</text>
 <rect x="510" y="590" width="200" height="75" rx="16" fill="#082f49" stroke="#38bdf8"/><text x="610" y="635" fill="#bae6fd" font-size="19">OpenRouter</text>
 <rect x="730" y="590" width="200" height="75" rx="16" fill="#172554" stroke="#818cf8"/><text x="830" y="635" fill="#c7d2fe" font-size="19">Mistral</text>
 <rect x="950" y="590" width="200" height="75" rx="16" fill="#082f49" stroke="#38bdf8"/><text x="1050" y="635" fill="#bae6fd" font-size="19">Cloudflare AI</text>
 <rect x="1170" y="590" width="160" height="75" rx="16" fill="#111827" stroke="#64748b"/><text x="1250" y="635" fill="#cbd5e1" font-size="18">+ others</text>
</g>
<!-- infrastructure -->
<g font-family="Inter,Arial" text-anchor="middle">
 <rect x="230" y="710" width="940" height="70" rx="18" fill="#020617" stroke="#334155"/>
 <text x="700" y="738" fill="#7dd3fc" font-size="16" font-weight="800">INFRASTRUCTURE</text><text x="700" y="762" fill="#cbd5e1" font-size="15">Linux • 3X-UI • Xray / Sing-box • Docker • Nginx • systemd • GitHub Actions</text>
</g>
<!-- arrows -->
<g stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)"><line x1="320" y1="232" x2="375" y2="232"/><line x1="1025" y1="232" x2="1080" y2="232"/><line x1="700" y1="300" x2="700" y2="370"/><line x1="265" y1="515" x2="265" y2="590"/><line x1="700" y1="515" x2="700" y2="590"/><line x1="1135" y1="515" x2="1135" y2="590"/><line x1="1135" y1="665" x2="1050" y2="710"/><line x1="265" y1="665" x2="350" y2="710"/></g>
</svg>